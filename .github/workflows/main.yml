name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - stable
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -race -short ./...
      - run: go vet ./...
        working-directory: benchmarks
      - run: go test -bench . -benchtime 1x ./...
        working-directory: benchmarks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pinned below stable: the latest staticcheck (v0.8.1) cannot read the export data of Go 1.27.2, which added version 5, so it fails before it analyzes anything. Go 1.27.1 still writes version 4, which it reads. Use stable again once staticcheck supports it.
          go-version: 1.27.1
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
